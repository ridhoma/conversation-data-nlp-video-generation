[project]
name = "conversation-data-nlp-video-generation"
version = "0.1.0"
description = "NLP analysis of AI video-generation assistant conversations"
requires-python = ">=3.12"
dependencies = [
    "ds-core[nlp,viz,model]",
]

# Local path, non-editable: a built snapshot of the shared stack, not a track of
# ongoing ds-core edits. No remote involved.
[tool.uv.sources]
ds-core = { path = "../../lib/ds-core" }

[dependency-groups]
dev = ["ipykernel"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Real packages: the folder name IS the import name (no remap). Notebooks import
# `from nlp.pipelines import ...`, `from data_science.visualisation import ...`, etc.
# Submodules added later are importable automatically.
[tool.hatch.build.targets.wheel]
packages = ["nlp", "data_science"]
